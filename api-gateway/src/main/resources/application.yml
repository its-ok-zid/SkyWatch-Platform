server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
        - id: flight-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/flights/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
