server:
  port: 8080

spring:
  application:
    name: api-gateway
  redis:
    host: localhost
    port: 6379
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: defaultCircuit
                fallbackUri: forward:/fallback
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@userKeyResolver}"
  resilience4j:
    circuitbreaker:
      instances:
        defaultCircuit:
          slidingWindowSize: 10
          failureRateThreshold: 50
          waitDurationInOpenState: 60s
          permittedNumberOfCallsInHalfOpenState: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

jwt:
  secret: SkyWatchSuperSecretKeyForJWTSigning123456
